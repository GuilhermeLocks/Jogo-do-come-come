<!DOCTYPE html>
<html>
<head>
    <title>Python no HTML com PyScript</title>
    <!-- Importa o PyScript -->
    <link rel="stylesheet" href="pyscript.net" />
    <script type="module" src="pyscript.net"></script>
</head>
<body>
    <h1>Exemplo Python e HTML</h1>
    <div id="output"></div>

    <!-- Código Python aqui dentro -->
    <py-script>
        print("Olá do Python, rodando no navegador!")
    </py-script>
</body>
</html>
